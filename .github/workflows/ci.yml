name: CI

# PAUSED FOR NOW: the suites run locally. Started only by hand from the Actions tab; to turn it back
# on, put back the triggers it had:
#
#   push:
#     branches: [master]
#   pull_request:
on:
  workflow_dispatch:

env:
  MIX_ENV: test
  # TEMPORARY: OTP 29.0.5, not the 29.1.x of .tool-versions, in every job and every cache key
  # below. From OTP 29.0.6 on, :httpc stops at 10240 bytes of response headers by default, and the
  # redirect GitHub answers a release download with now carries about 10.8 KB of them, so precompiled
  # NIFs and binaries downloaded through :httpc (elixir_make, cc_precompiler, rustler_precompiled,
  # tailwind) fail with {:header_too_long, {:max, 10240}}. Move back to the latest OTP, with
  # `version-file: .tool-versions` and .tool-versions in the cache keys again, once a fixed OTP
  # release or fixed libraries are out.
  OTP_VERSION: "29.0.5"
  ELIXIR_VERSION: "1.20.4-otp-29"
  # setup-beam installs Hex from builds.hex.pm, and one slow response there failed a whole run
  # ("Could not mix hex from any hex.pm mirror"). It tries these in order.
  HEXPM_MIRRORS: |
    https://builds.hex.pm
    https://cdn.jsdelivr.net/hex

jobs:
  # Compiled once; the jobs below start from this build.
  #
  # A cache entry can never be changed once saved, so the key carries the commit: each run saves the
  # build it made, and the next one starts from the nearest one before it (`restore-keys`) and
  # compiles only what changed.
  build:
    runs-on: ubuntu-latest

    steps:
      # Only this repository. The Mishka packages come from Hex at the versions mix.lock pins, as
      # they do for any user of Mishka CMS, and mix.exs would use an __extensions/ checkout over Hex
      # if it found one, so none is ever checked out here.
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-

      - run: mix deps.get

      - run: mix compile --warnings-as-errors

  # Beside the tests rather than in front of them.
  format:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      # The formatter takes the DSL's paren-free calls (`table "pages"`, `reference :site, ...`)
      # from the dependencies in .formatter.exs's import_deps, so it runs once they are fetched.
      - run: mix format --check-formatted

  # FOUR MACHINES, A QUARTER OF THE TEST FILES EACH. Most of the suite is `async: false` — it shares
  # the runtime's global state — and runs one module at a time, so more cores do not make it faster
  # and more machines do. Mix deals the test files out by `--partitions`, and each partition has its
  # own Postgres and its own database (`config/test.exs` names it after MIX_TEST_PARTITION).
  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      MIX_TEST_PARTITION: ${{ matrix.partition }}

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
          version-type: strict
          hexpm-mirrors: ${{ env.HEXPM_MIRRORS }}

      - uses: actions/cache/restore@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-${{ env.OTP_VERSION }}-elixir-${{ env.ELIXIR_VERSION }}-mix-${{ hashFiles('mix.lock') }}-${{ github.sha }}
          fail-on-cache-miss: true

      # The Oban tables: the migration `mix dev_reset` writes with `oban.install`, an igniter task
      # that the test environment does not have.
      - run: |
          mkdir -p priv/repo/migrations
          cat > priv/repo/migrations/20000101000000_add_oban.exs <<'MIGRATION'
          defmodule MishkaCms.Repo.Migrations.AddOban do
            use Ecto.Migration

            def up, do: Oban.Migration.up()

            def down, do: Oban.Migration.down(version: 1)
          end
          MIGRATION

      # The migrations are generated, not in git: generate them before the test alias's `ash.setup`
      # migrates the test database.
      - run: mix ash.codegen ci

      # --warnings-as-errors also fails on warnings in the test files, which a plain run can print
      # while a test captures stderr, where nobody sees them — each in the partition that compiles it.
      - run: mix test --warnings-as-errors --partitions 4
        env:
          POSTGRES_HOST: localhost
          DB_HOST: localhost

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile && bun run test
        working-directory: assets

  # The image builds from a clean checkout. It carries no migrations (they are generated, not in
  # git), so this checks the build, not a deploy.
  docker:
    runs-on: ubuntu-latest
    needs: [test, assets]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
