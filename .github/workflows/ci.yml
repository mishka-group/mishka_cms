name: CI

# Every pull request, and every push to master. The Actions tab can start it by hand as well. A tag
# does not run it: the commit a tag points at already ran here on master, and release.yml takes the
# tag from there. The jobs live in mishka-ci.yml, which the other Mishka repositories call too.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/mishka-ci.yml
    with:
      postgres: true
      partitions: 6
      # The migrations are not in git: each partition generates them before its tests.
      pre-test: .github/scripts/generate_migrations.sh ci
      test-args: ${{ github.event_name != 'pull_request' && '--include slow' || '' }}
      credo: false
      dialyzer: false
      ex_dna: false
      assets: true
      bun-version: "1.4.4"
      # The image is built and smoke-tested on master and by hand; nothing is pushed.
      custom-jobs: >-
        ${{ (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master'))
        && '[{"name":"docker","setup":["elixir"],"run":"MIX_ENV=test .github/scripts/generate_migrations.sh ci && docker build -t mishka-cms:ci . && .github/scripts/smoke_test.sh mishka-cms:ci"}]'
        || '' }}
