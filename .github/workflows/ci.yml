name: CI

# PAUSED FOR NOW: the suites run locally. Started only by hand from the Actions tab; to turn it back
# on, put back the triggers it had:
#
#   push:
#     branches: [master]
#   pull_request:
on:
  workflow_dispatch:

env:
  MIX_ENV: test

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - __extensions/mishka_cms_core
          - __extensions/mishka_blog
          - __extensions/mishka_document
          - .

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # __extensions/mishka_gervaz is a gitignored path dependency of every project. This step goes
      # when mishka_gervaz comes from Hex and the extensions from their own repositories.
      - uses: actions/checkout@v7
        with:
          repository: mishka-group/mishka_gervaz
          ref: ${{ vars.GERVAZ_REF || 'master' }}
          path: __extensions/mishka_gervaz

      # .tool-versions names the same Elixir and OTP as the Dockerfile's builder image.
      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.project }}/deps
            ${{ matrix.project }}/_build
          key: ${{ runner.os }}-${{ matrix.project }}-${{ hashFiles('.tool-versions', format('{0}/mix.lock', matrix.project)) }}

      # Core compiles its icon catalogue from the root's deps/heroicons, and an empty catalogue fails
      # --warnings-as-errors, so an extension's job fetches the root's dependencies too.
      - run: mix deps.get
        if: matrix.project != '.'

      - run: mix deps.get
        working-directory: ${{ matrix.project }}

      - run: mix compile --warnings-as-errors
        working-directory: ${{ matrix.project }}

      - run: mix format --check-formatted
        working-directory: ${{ matrix.project }}

      # The root's Oban tables: the migration `mix dev_reset` writes with `oban.install`, an igniter
      # task that the test environment does not have.
      - run: |
          cat > priv/repo/migrations/20000101000000_add_oban.exs <<'EOF'
          defmodule MishkaCms.Repo.Migrations.AddOban do
            use Ecto.Migration

            def up, do: Oban.Migration.up()

            def down, do: Oban.Migration.down(version: 1)
          end
          EOF
        if: matrix.project == '.'

      # The migrations are generated, not in git, in every project: generate them before the test
      # alias's `ash.setup` migrates the test database.
      - run: mix ash.codegen ci
        working-directory: ${{ matrix.project }}

      # --warnings-as-errors also fails on warnings in the test files, which a plain run can print
      # while a test captures stderr, where nobody sees them.
      - run: mix test --warnings-as-errors
        working-directory: ${{ matrix.project }}
        env:
          POSTGRES_HOST: localhost
          DB_HOST: localhost

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile && bun run test
        working-directory: assets

  # The image builds from a clean checkout. It carries no root migrations (they are generated, not in
  # git), so this checks the build, not a deploy.
  docker:
    runs-on: ubuntu-latest
    needs: [test, assets]
    steps:
      - uses: actions/checkout@v7
      # The build context needs mishka_gervaz, as the test jobs do, until it comes from Hex.
      - uses: actions/checkout@v7
        with:
          repository: mishka-group/mishka_gervaz
          ref: ${{ vars.GERVAZ_REF || 'master' }}
          path: __extensions/mishka_gervaz
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
