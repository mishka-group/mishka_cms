name: REUSE

# Started by hand from the Actions tab: every tracked file carries an SPDX header or is covered by
# REUSE.toml.
on:
  workflow_dispatch:

jobs:
  reuse:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: fsfe/reuse-action@v5
        with:
          args: lint
