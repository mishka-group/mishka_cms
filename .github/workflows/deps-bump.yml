name: Deps bump

# A Mishka package this one depends on was released: open a PR that moves mix.exs and mix.lock to it.
on:
  repository_dispatch:
    types: [upstream-released]

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  bump:
    uses: ./.github/workflows/mishka-deps-bump.yml
    with:
      package: ${{ github.event.client_payload.package }}
      version: ${{ github.event.client_payload.version }}
    secrets:
      MISHKA_CI_APP_PRIVATE_KEY: ${{ secrets.MISHKA_CI_APP_PRIVATE_KEY }}
