# Dependabot opens one pull request per ecosystem and week: every version update of an ecosystem is
# grouped into a single PR and checked weekly, so keeping up costs one review a week and not one per
# package. Security updates are not bound to this schedule: Dependabot opens them as soon as an
# advisory is published, when they are enabled in the repository settings.

version: 2

updates:
  # No versioning-strategy: Dependabot rejects `increase` for mix, and its default (`auto`) already
  # raises an app's requirement in mix.exs together with mix.lock when a release needs it.
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      hex-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: bun
    directory: /assets
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      bun-dependencies:
        patterns:
          - "*"

  # No docker entry: the root Dockerfile builds its FROM images from ARGs, which Dependabot cannot
  # read, and hexpm/elixir has about a million tags on Docker Hub, so listing them times out (504), and
  # the job fails. The images in Dockerfile and examples/docker/Dockerfile.dev are bumped by hand, together.
